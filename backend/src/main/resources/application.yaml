spring:
  application:
    name: backend
  docker:
    compose:
      enabled: ${DOCKER_COMPOSE_ENABLED:false}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:phcauto}}
    username: ${POSTGRES_USER:phcauto}
    password: ${POSTGRES_PASSWORD:phcauto_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      username: ${REDIS_USERNAME:}
      database: ${REDIS_DATABASE:0}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      repositories:
        enabled: false
  cache:
    type: redis

app:
  cache:
    ttl: ${REDIS_CACHE_TTL:10m}
    key-prefix: ${REDIS_CACHE_PREFIX:phcauto:cache:}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
