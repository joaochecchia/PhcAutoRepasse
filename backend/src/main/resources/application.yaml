spring:
  jackson:
    deserialization:
      accept-float-as-int: false
  application:
    name: backend
  docker:
    compose:
      enabled: ${DOCKER_COMPOSE_ENABLED:false}
  jpa:
    open-in-view: false
  flyway:
    # Execução explícita por datasource em PersistenceConfig.
    enabled: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      username: ${REDIS_USERNAME:}
      database: ${REDIS_DATABASE:0}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      repositories:
        enabled: false
  cache:
    type: redis
  servlet:
    multipart:
      max-file-size: ${FOTO_MAX_FILE_SIZE:10MB}
      max-request-size: ${FOTO_MAX_REQUEST_SIZE:11MB}
  modulith:
    detection-strategy: explicitly-annotated
    events:
      jdbc:
        schema-initialization:
          enabled: false
      completion-mode: delete
      republish-outstanding-events-on-restart: true
      staleness:
        check-interval: 30s
        published: 2m
        processing: 2m
        resubmitted: 2m
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}

server:
  shutdown: graceful
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:NONE}

app:
  security:
    production: ${PRODUCTION_MODE:false}
  compliance:
    termos-uso-versao: ${TERMOS_USO_VERSAO_ATUAL:1.1}
    politica-privacidade-versao: ${POLITICA_PRIVACIDADE_VERSAO_ATUAL:1.1}
  events:
    workers: ${MODULITH_EVENT_WORKERS:2}
    queue-capacity: ${MODULITH_EVENT_QUEUE_CAPACITY:1000}
  datasource:
    write:
      jdbc-url: ${WRITE_DATABASE_URL:${DATABASE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:phcauto}}}
      username: ${POSTGRES_USER:phcauto}
      password: ${POSTGRES_PASSWORD:phcauto_local}
      pool-name: phcauto-write
      maximum-pool-size: ${WRITE_POOL_SIZE:10}
      connection-timeout: 5000
    read:
      jdbc-url: ${READ_DATABASE_URL:jdbc:postgresql://localhost:${POSTGRES_READ_PORT:5433}/${POSTGRES_DB:phcauto}}
      username: ${POSTGRES_READ_USER:phcauto_read}
      password: ${POSTGRES_READ_PASSWORD:phcauto_read_local}
      read-only: true
      pool-name: phcauto-read
      maximum-pool-size: ${READ_POOL_SIZE:10}
      connection-timeout: 5000
    projection:
      jdbc-url: ${READ_DATABASE_URL:jdbc:postgresql://localhost:${POSTGRES_READ_PORT:5433}/${POSTGRES_DB:phcauto}}
      username: ${PROJECTION_USER:phcauto_projection}
      password: ${PROJECTION_PASSWORD:phcauto_projection_local}
      pool-name: phcauto-projection
      maximum-pool-size: ${PROJECTION_POOL_SIZE:5}
      connection-timeout: 3000
  projection:
    bootstrap: ${PROJECTION_BOOTSTRAP:true}
    retry-delay: ${PROJECTION_RETRY_DELAY:30s}
  storage:
    fotos:
      diretorio: ${FOTOS_DIRETORIO:./src/main/resources/static/uploads/veiculos}
      tamanho-maximo-bytes: ${FOTOS_TAMANHO_MAXIMO_BYTES:10485760}
      tamanho-alvo-bytes: ${FOTOS_TAMANHO_ALVO_BYTES:5242880}
  cache:
    ttl: ${REDIS_CACHE_TTL:10m}
    key-prefix: ${REDIS_CACHE_PREFIX:phcauto:cache:}
  rate-limit:
    key-prefix: ${RATE_LIMIT_KEY_PREFIX:phcauto:ratelimit:}
    fallback-max-keys: ${RATE_LIMIT_FALLBACK_MAX_KEYS:10000}
    login:
      limit: ${RATE_LIMIT_LOGIN_LIMIT:10}
      window: ${RATE_LIMIT_LOGIN_WINDOW:1m}
    registro:
      limit: ${RATE_LIMIT_REGISTRO_LIMIT:5}
      window: ${RATE_LIMIT_REGISTRO_WINDOW:1h}
    refresh:
      limit: ${RATE_LIMIT_REFRESH_LIMIT:20}
      window: ${RATE_LIMIT_REFRESH_WINDOW:1m}
    busca:
      limit: ${RATE_LIMIT_BUSCA_LIMIT:120}
      window: ${RATE_LIMIT_BUSCA_WINDOW:1m}
    upload-foto-anuncio:
      limit: ${RATE_LIMIT_FOTO_ANUNCIO_LIMIT:30}
      window: ${RATE_LIMIT_FOTO_ANUNCIO_WINDOW:1h}
    upload-foto-perfil:
      limit: ${RATE_LIMIT_FOTO_PERFIL_LIMIT:10}
      window: ${RATE_LIMIT_FOTO_PERFIL_WINDOW:1h}
    contato-whatsapp:
      limit: ${RATE_LIMIT_WHATSAPP_LIMIT:10}
      window: ${RATE_LIMIT_WHATSAPP_WINDOW:1h}
    tentativas-senha:
      limit: ${RATE_LIMIT_PASSWORD_ATTEMPTS_LIMIT:5}
      window: ${RATE_LIMIT_PASSWORD_ATTEMPTS_WINDOW:15m}
  observability:
    projection-check-interval: ${PROJECTION_OBSERVABILITY_INTERVAL:30s}
    dependency-check-interval: ${DEPENDENCY_OBSERVABILITY_INTERVAL:30s}
    sentry:
      dsn: ${SENTRY_DSN:}
      environment: ${SENTRY_ENVIRONMENT:development}
      release: ${SENTRY_RELEASE:}

management:
  server:
    port: ${MANAGEMENT_PORT:9091}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      show-components: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  file:
    name: ${LOG_FILE:./logs/backend.log}
  logback:
    rollingpolicy:
      max-file-size: ${LOG_MAX_FILE_SIZE:20MB}
      max-history: ${LOG_MAX_HISTORY:14}
      total-size-cap: ${LOG_TOTAL_SIZE_CAP:1GB}
      clean-history-on-start: true

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    csrf:
      enabled: true
