services:
  backend:
    image: phcauto-backend:local
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET em .env com ao menos 32 bytes aleatorios em Base64}
      JWT_ISSUER: ${JWT_ISSUER:-phcauto}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-2592000}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      PRODUCTION_MODE: ${PRODUCTION_MODE:-false}
      APP_BOOTSTRAP_PRIVILEGED_USERS_ENABLED: ${BOOTSTRAP_PRIVILEGED_USERS_ENABLED:-false}
      BOOTSTRAP_DONO_EMAIL: ${BOOTSTRAP_DONO_EMAIL:-}
      BOOTSTRAP_DONO_PASSWORD: ${BOOTSTRAP_DONO_PASSWORD:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      WRITE_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-phcauto}
      READ_DATABASE_URL: jdbc:postgresql://postgres-read:5432/${POSTGRES_DB:-phcauto}
      POSTGRES_READ_USER: ${POSTGRES_READ_USER:-phcauto_read}
      POSTGRES_READ_PASSWORD: ${POSTGRES_READ_PASSWORD:-phcauto_read_local}
      PROJECTION_USER: ${PROJECTION_USER:-phcauto_projection}
      PROJECTION_PASSWORD: ${PROJECTION_PASSWORD:-phcauto_projection_local}
      PROJECTION_BOOTSTRAP: ${PROJECTION_BOOTSTRAP:-true}
      MODULITH_EVENT_WORKERS: ${MODULITH_EVENT_WORKERS:-2}
      MODULITH_EVENT_QUEUE_CAPACITY: ${MODULITH_EVENT_QUEUE_CAPACITY:-1000}
      PROJECTION_RETRY_DELAY: ${PROJECTION_RETRY_DELAY:-30s}
      POSTGRES_USER: ${POSTGRES_USER:-phcauto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-phcauto_local}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      REDIS_CACHE_TTL: ${REDIS_CACHE_TTL:-10m}
      REDIS_CACHE_PREFIX: ${REDIS_CACHE_PREFIX:-phcauto:cache:}
      DOCKER_COMPOSE_ENABLED: "false"
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      FOTOS_DIRETORIO: /app/uploads/veiculos
      FOTOS_TAMANHO_MAXIMO_BYTES: ${FOTOS_TAMANHO_MAXIMO_BYTES:-10485760}
      FOTOS_TAMANHO_ALVO_BYTES: ${FOTOS_TAMANHO_ALVO_BYTES:-5242880}
      MANAGEMENT_PORT: 9091
      FIPE_PARALLELUM_TOKEN: ${FIPE_PARALLELUM_TOKEN:-}
      FIPE_PERSISTENCE_AUTHORIZED: ${FIPE_PERSISTENCE_AUTHORIZED:-true}
      FIPE_SYNC_DELAY: ${FIPE_SYNC_DELAY:-5000}
      FIPE_CATALOG_CACHE_TTL: ${FIPE_CATALOG_CACHE_TTL:-PT10M}
      FIPE_CONNECT_TIMEOUT: ${FIPE_CONNECT_TIMEOUT:-PT2S}
      FIPE_REQUEST_TIMEOUT: ${FIPE_REQUEST_TIMEOUT:-PT6S}
      FIPE_REQUEST_ATTEMPTS: ${FIPE_REQUEST_ATTEMPTS:-2}
      FIPE_FAILURE_COOLDOWN: ${FIPE_FAILURE_COOLDOWN:-PT10S}
      FIPE_DAILY_LIMIT: ${FIPE_DAILY_LIMIT:-900}
      FIPE_IMPORT_DIRECTORY: /app/data/fipe
      FIPE_MONTHLY_SOURCE: ${FIPE_MONTHLY_SOURCE:-IMPORTACAO_ADMINISTRATIVA}
      LOG_FILE: /app/logs/backend.log
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      BREVO_ENABLED: ${BREVO_ENABLED:-false}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-PHC Auto}
      BREVO_TEMPLATE_2FA_ID: ${BREVO_TEMPLATE_2FA_ID:-0}
      BREVO_TEMPLATE_PASSWORD_RESET_ID: ${BREVO_TEMPLATE_PASSWORD_RESET_ID:-0}
      BREVO_TEMPLATE_PASSWORD_CHANGED_ID: ${BREVO_TEMPLATE_PASSWORD_CHANGED_ID:-0}
      MFA_ENABLED: ${MFA_ENABLED:-false}
      MFA_HMAC_SECRET: ${MFA_HMAC_SECRET:-}
      MFA_CODE_TTL: ${MFA_CODE_TTL:-5m}
      MFA_MAX_ATTEMPTS: ${MFA_MAX_ATTEMPTS:-5}
      MFA_RESEND_COOLDOWN: ${MFA_RESEND_COOLDOWN:-60s}
      TRUSTED_DEVICE_TTL: ${TRUSTED_DEVICE_TTL:-30d}
      PASSWORD_RESET_TTL: ${PASSWORD_RESET_TTL:-20m}
      PASSWORD_RESET_FRONTEND_URL: ${PASSWORD_RESET_FRONTEND_URL:-http://localhost:5173/#redefinir-senha}
      OAUTH2_ENABLED: ${OAUTH2_ENABLED:-false}
      OAUTH2_FRONTEND_URL: ${OAUTH2_FRONTEND_URL:-http://localhost:5173}
      OAUTH2_REGISTRATION_TTL: ${OAUTH2_REGISTRATION_TTL:-10m}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      RATE_LIMIT_LOGIN_LIMIT: ${RATE_LIMIT_LOGIN_LIMIT:-10}
      RATE_LIMIT_REGISTRO_LIMIT: ${RATE_LIMIT_REGISTRO_LIMIT:-5}
      RATE_LIMIT_REFRESH_LIMIT: ${RATE_LIMIT_REFRESH_LIMIT:-20}
      RATE_LIMIT_BUSCA_LIMIT: ${RATE_LIMIT_BUSCA_LIMIT:-120}
      RATE_LIMIT_FOTO_ANUNCIO_LIMIT: ${RATE_LIMIT_FOTO_ANUNCIO_LIMIT:-30}
      RATE_LIMIT_FOTO_PERFIL_LIMIT: ${RATE_LIMIT_FOTO_PERFIL_LIMIT:-10}
      RATE_LIMIT_WHATSAPP_LIMIT: ${RATE_LIMIT_WHATSAPP_LIMIT:-10}
      RATE_LIMIT_PASSWORD_ATTEMPTS_LIMIT: ${RATE_LIMIT_PASSWORD_ATTEMPTS_LIMIT:-5}
      RATE_LIMIT_2FA_VERIFY_LIMIT: ${RATE_LIMIT_2FA_VERIFY_LIMIT:-10}
      RATE_LIMIT_2FA_RESEND_LIMIT: ${RATE_LIMIT_2FA_RESEND_LIMIT:-3}
      RATE_LIMIT_PASSWORD_RESET_LIMIT: ${RATE_LIMIT_PASSWORD_RESET_LIMIT:-5}
      RATE_LIMIT_PASSWORD_RESET_CONFIRM_LIMIT: ${RATE_LIMIT_PASSWORD_RESET_CONFIRM_LIMIT:-10}
      RATE_LIMIT_FALLBACK_MAX_KEYS: ${RATE_LIMIT_FALLBACK_MAX_KEYS:-10000}
    volumes:
      - ./src/main/resources/static/uploads/veiculos:/app/uploads/veiculos
      - ./logs/backend:/app/logs
      - ./data/fipe:/app/data/fipe
    expose:
      - "9091"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9091/actuator/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      postgres-bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-phcauto}
      POSTGRES_USER: ${POSTGRES_USER:-phcauto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-phcauto_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  postgres-read:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-phcauto}
      POSTGRES_USER: ${PROJECTION_USER:-phcauto_projection}
      POSTGRES_PASSWORD: ${PROJECTION_PASSWORD:-phcauto_projection_local}
    ports:
      - "127.0.0.1:${POSTGRES_READ_PORT:-5433}:5432"
    volumes:
      # Volume novo: não reutilizar o volume da antiga réplica física.
      - postgres_projection_data:/var/lib/postgresql/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  postgres-bootstrap:
    image: postgres:17
    restart: "no"
    entrypoint: ["sh", "/scripts/bootstrap.sh"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-phcauto}
      PROJECTION_USER: ${PROJECTION_USER:-phcauto_projection}
      PROJECTION_PASSWORD: ${PROJECTION_PASSWORD:-phcauto_projection_local}
      POSTGRES_READ_USER: ${POSTGRES_READ_USER:-phcauto_read}
      POSTGRES_READ_PASSWORD: ${POSTGRES_READ_PASSWORD:-phcauto_read_local}
    volumes:
      - ./docker/postgres/bootstrap.sh:/scripts/bootstrap.sh:ro
    depends_on:
      postgres-read:
        condition: service_healthy
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  redis:
    image: redis:7.4
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "${REDIS_MAXMEMORY:-256mb}", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  postgres_data:
  postgres_projection_data:
  redis_data:
